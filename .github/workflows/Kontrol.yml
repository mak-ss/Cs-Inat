name: Domain Değişiklik Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Sürümünü Göster
        run: python --version

      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel cloudscraper pycryptodome

      - name: Betiği Çalıştır
        run: python KONTROL.py

      - name: Commit ve Push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "🤖 Domain Update" -m "Automatic domain update"

          for i in 1 2 3 4 5; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push başarısız, rebase edilip tekrar deneniyor ($i)..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((i * 2))
          done

          echo "Push, tekrar denemelere rağmen başarısız oldu"
          exit 1

      - name: Token Kontrolü
        if: steps.commit.outputs.changed == 'true'
        id: tokencheck
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "${PAT_TOKEN}" ]; then
            echo "::error::PAT_TOKEN secret'ı tanımlı değil veya boş!"
            echo "Repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "Ad: PAT_TOKEN, Değer: 'repo' + 'workflow' scope'lu bir Personal Access Token"
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "has_token=true" >> "$GITHUB_OUTPUT"

      - name: build.yml Tetikle
        if: steps.commit.outputs.changed == 'true' && steps.tokencheck.outputs.has_token == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          echo "build.yml tetikleniyor (ref: ${{ github.ref_name }})..."
          gh workflow run build.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
          echo "Tetikleme başarılı."
