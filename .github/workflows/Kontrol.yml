name: Domain Değişiklik Kontrolü

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '25 */6 * * *'

jobs:
  DomainKontrol:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python Sürümünü Göster
        run: python --version

      - name: Gereksinimleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel cloudscraper pycryptodome

      - name: Betiği Çalıştır
        run: python KONTROL.py

      - name: Commit ve Push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "🤖 Domain Update" -m "Automatic domain update"

          # Remote'daki yeni commit'leri al ve kendi commit'imizi üstüne rebase et
          for i in 1 2 3 4 5; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push başarısız, rebase edilip tekrar deneniyor ($i)..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((i * 2))
          done

          echo "Push, tekrar denemelere rağmen başarısız oldu"
          exit 1

      - name: build.yml Tetikle
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh workflow run build.yml --ref ${{ github.ref_name }}
